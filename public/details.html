<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .cover-img {
            width: 100%;
            max-width: 300px;
            border-radius: 10px;
        }

        .book-info h2 {
            margin-bottom: 10px;
        }

        .star {
            cursor: pointer;
            color: gold;
            transition: 0.15s;
        }

        .star:hover {
            transform: scale(1.2);
        }
    </style>
</head>

<body data-bs-theme="dark">

    <nav class="navbar navbar-expand-lg bg-body-tertiary mb-3">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-book"></i> BookVerse
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="fa-regular fa-house"></i> Home
                        </a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="list.html">
                            <i class="fa-solid fa-list"></i> List
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="bookstore.html">
                            <i class="fa-solid fa-store"></i> Bookstores
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <div id="book-details" class="row"></div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search)
        const id = params.get('id')

        const container = document.getElementById('book-details')

        fetch(`https://openlibrary.org${id}.json`)
            .then(res => res.json())
            .then(data => {

                const title = data.title || 'No title'

                const description = data.description
                    ? (typeof data.description === 'string'
                        ? data.description
                        : data.description.value)
                    : 'No description available'

                const authors = data.authors
                    ? data.authors.map(a => a.author.key)
                    : []

                Promise.all(
                    authors.map(url =>
                        fetch(`https://openlibrary.org${url}.json`)
                            .then(res => res.json())
                    )
                ).then(authorData => {

                    const authorNames = authorData.map(a => a.name).join(', ')

                    const cover = data.covers
                        ? `https://covers.openlibrary.org/b/id/${data.covers[0]}-L.jpg`
                        : 'https://via.placeholder.com/300x450?text=No+Cover'


                    container.innerHTML = `
                <div class="col-md-4 text-center">
                    <img src="${cover}" class="cover-img">
                </div>

                <div class="col-md-8 book-info">
                    <h2>${title}</h2>
                    <h5>Author: ${authorNames || 'Unknown'}</h5>
                    <p><strong>First published:</strong> ${data.first_publish_date || 'N/A'}</p>

                    <hr>

                    <p>${description}</p>

                    <div class="mt-4">
                        <h5>Rate this book:</h5>
                        <div id="rating" class="fs-3">
                            <i class="fa-regular fa-star star" data-value="1"></i>
                            <i class="fa-regular fa-star star" data-value="2"></i>
                            <i class="fa-regular fa-star star" data-value="3"></i>
                            <i class="fa-regular fa-star star" data-value="4"></i>
                            <i class="fa-regular fa-star star" data-value="5"></i>
                        </div>
                    </div>
                </div>
            `

                    //rating
                    const stars = document.querySelectorAll(".star")

                    let savedRatings = JSON.parse(localStorage.getItem("ratings")) || {}
                    let currentRating = savedRatings[id] || 0

                    function renderStars(rating) {
                        stars.forEach(star => {
                            const value = parseInt(star.dataset.value)

                            if (value <= rating) {
                                star.classList.add("fa-solid")
                                star.classList.remove("fa-regular")
                            } else {
                                star.classList.add("fa-regular")
                                star.classList.remove("fa-solid")
                            }
                        })
                    }

                    renderStars(currentRating)

                    // on click final rating
                    stars.forEach(star => {
                        star.addEventListener("click", () => {
                            const value = parseInt(star.dataset.value)

                            currentRating = value
                            savedRatings[id] = value

                            localStorage.setItem("ratings", JSON.stringify(savedRatings))

                            renderStars(currentRating)
                        })
                    })

                    // hover effect
                    stars.forEach(star => {
                        star.addEventListener("mouseover", () => {
                            const value = parseInt(star.dataset.value)

                            stars.forEach(s => {
                                const v = parseInt(s.dataset.value)

                                if (v <= value) {
                                    s.classList.add("fa-solid")
                                    s.classList.remove("fa-regular")
                                } else {
                                    s.classList.add("fa-regular")
                                    s.classList.remove("fa-solid")
                                }
                            })
                        })

                        star.addEventListener("mouseout", () => {
                            renderStars(currentRating)
                        })
                    })
                })
            })
    </script>


</body>

</html>
