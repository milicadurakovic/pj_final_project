<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstores :: BookVerse</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body data-bs-theme="dark">

    <nav class="navbar navbar-expand-lg bg-body-tertiary mb-3">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-book"></i> BookVerse
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="fa-solid fa-house"></i> Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="list.html">
                            <i class="fa-solid fa-list"></i> Books
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="bookstore.html">
                            <i class="fa-solid fa-store"></i> Bookstores
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="reservation.html">
                           <i class="fa-solid fa-magnifying-glass"></i> Reservations
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container">

        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Bookstore Name</th>
                    <th scope="col">Address</th>
                    <th scope="col">Options</th>
                </tr>
            </thead>

            <tbody id="bookstores"></tbody>
        </table>

    </div>
    <div class="d-flex justify-content-end mb-3" style="padding-right: 120px;">
        <a href="new-bookstore.html" class="btn btn-success">
            <i class="fa-solid fa-plus"></i> Add Bookstore
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        const table = document.getElementById('bookstores')

        function edit(id) {
            window.location.href = '/edit-bookstore.html?id=' + id

        }
        function remove(id) {
            if (!confirm(`Are you sure you want to delete bookstore ${id}?`))
                return
            fetch(`/api/bookstore/${id}`, { method: 'delete' })
                .then(rsp => window.location.reload())


        }

        fetch('/api/bookstore')
            .then(rsp => rsp.json())
            .then(data => {

                let content = ''

                for (let bookstore of data) {
                    content += `
                    <tr>
                        <th scope="row">${bookstore.bookstoreId}</th>
                        <td>${bookstore.name}</td>
                        <td>${bookstore.adress}</td>
                        <td>
                            
                                <button href="#" class="btn btn-sm btn-success" type="button" onclick="edit(${bookstore.bookstoreId})">
                                    <i class="fa-regular fa-pen-to-square"></i>
                                </button>
                                <button href="#" class="btn btn-sm btn-danger" type="button" onclick="remove(${bookstore.bookstoreId})">
                                    <i class="fa-solid fa-trash-can"></i> 
                                </button>
                            
                            
                        </td>
                    </tr>
                    `
                }

                table.innerHTML = content
            })
            .catch(err => {
                console.error(err)
            })
    </script>

</body>

</html>
