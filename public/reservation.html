<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations :: BookVerse</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body data-bs-theme="dark">
    <nav class="navbar navbar-expand-lg bg-body-tertiary mb-3">
        <div class="container">
            <a class="navbar-brand" href="./index.html">
                <i class="fa-solid fa-book"></i> BookVerse
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="fa-regular fa-house"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="list.html">
                            <i class="fa-solid fa-list"></i> List
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="bookstore.html">
                            <i class="fa-solid fa-store"></i> Bookstores
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active " href="reservation.html">
                            <i class="fa-solid fa-magnifying-glass"></i> Reservations
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    
    <div class="container">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Book</th>
                    <th>Bookstore</th>
                    <th>Customer</th>
                    <th>Status</th>
                    <th>Options</th>
                </tr>
            </thead>
            <tbody id="reservations"></tbody>
        </table>
    </div>

        <div class="d-flex justify-content-end mb-3" style="padding-right: 120px;">
            <a href="new-reservation.html" class="btn btn-success">
                <i class="fa-solid fa-plus"></i> Add new reservation
            </a>
        </div>

    </div>



    <script>

        const table = document.getElementById("reservations");
        const bookstoreSelect = document.getElementById("bookstore");

        //ucitavanje imena knjizare na osnovu id
        fetch("/api/bookstore")
            .then(r => r.json())
            .then(data => {
                let options = "";
                for (let b of data) {
                    options += `<option value="${b.bookstoreId}">${b.name}</option>`;
                }
                bookstoreSelect.innerHTML = options;
            });

        
        function createReservation() {

            fetch("/api/reservation", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    bookstoreId: bookstoreSelect.value,
                    bookName: document.getElementById("bookName").value,
                    customerName: document.getElementById("customerName").value,
                    status: document.getElementById("status").value
                })
            }).then(() => location.reload());
        }

        
        function remove(id) {
            if (!confirm("Delete reservation " + id + "?")) return;

            fetch(`/api/reservation/${id}`, { method: "DELETE" })
                .then(() => location.reload());
        }

        function edit(id) {
            window.location.href = '/edit-reservation.html?id=' + id;
        }



        
        function loadReservations() {

            fetch("/api/reservation")
                .then(r => r.json())
                .then(async data => {

                    let content = "";

                    for (let r of data) {

                        const bookstore = await fetch(`/api/bookstore/${r.bookstoreId}`)
                            .then(res => res.json());

                        content += `
                <tr>
                    <td>${r.reservationId}</td>
                    <td>${r.bookName || "-"}</td>
                    <td>${bookstore.name}</td>
                    <td>${r.customerName || "-"}</td>
                    <td>${r.status}</td>
                    <td>
                        <button href="#" class="btn btn-sm btn-success" type="button" onclick="edit(${r.reservationId})">
                            <i class="fa fa-edit"></i>
                        </button>

                        <button href="#" class="btn btn-sm btn-danger" type="button" onclick="remove(${r.reservationId})">
                            <i class="fa fa-trash"></i>
                        </button>
                    </td>
                </tr>
                `;
                    }

                    table.innerHTML = content;
                });
        }

        loadReservations();

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
