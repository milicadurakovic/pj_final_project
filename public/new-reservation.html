<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create reservation :: BookVerse</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/global.css" />
</head>

<body data-bs-theme="dark">

    <nav class="navbar navbar-expand-lg bg-body-tertiary mb-3">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-book"></i> BookVerse
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="fa-solid fa-house"></i> Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="list.html">
                            <i class="fa-solid fa-list"></i> Books
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link " href="bookstore.html">
                            <i class="fa-solid fa-store"></i> Bookstores
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="reservation.html">
                            <i class="fa-solid fa-magnifying-glass"></i>Reservations
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header">
                    <strong>
                        <i class="fa-solid fa-bookmark"></i>
                        Create Reservation
                    </strong>
                </div>

                <div class="card-body">

                    <div class="mb-3">
                        <label class="form-label">Bookstore</label>
                        <select id="bookstore" class="form-select"></select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Book Name</label>
                        <input id="bookName"
                               class="form-control"
                               placeholder="Enter book name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Customer Name</label>
                        <input id="customerName"
                               class="form-control"
                               placeholder="Enter customer name">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Status</label>
                        <select id="status" class="form-select">
                            <option>PENDING</option>
                            <option>CONFIRMED</option>
                            <option>CANCELED</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">

                        <button class="btn btn-success" onclick="createReservation()">
                            <i class="fa-solid fa-plus"></i>
                            Add Reservation
                        </button>

                        <a href="/reservation.html"
                           class="btn btn-secondary">
                            <i class="fa-solid fa-arrow-left"></i>
                            Back
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        
        const table = document.getElementById("reservations");
        const bookstoreSelect = document.getElementById("bookstore");

        function openAll(){
            window.location.href = '/reservation.html'
        }

         fetch("/api/bookstore")
            .then(r => r.json())
            .then(data => {
                let options = "";
                for (let b of data) {
                    options += `<option value="${b.bookstoreId}">${b.name}</option>`;
                }
                bookstoreSelect.innerHTML = options;
            });

        

        function createReservation() {

            fetch("/api/reservation", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    bookstoreId: bookstoreSelect.value,
                    bookName: document.getElementById("bookName").value,
                    customerName: document.getElementById("customerName").value,
                    status: document.getElementById("status").value
                })
            }).then(() => location.reload());
        }
        

    </script>

</body>

</html>
