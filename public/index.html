<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookVerse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        #books {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .book-card {
            width: 16rem;
        }

        .book-card img {
            width: 100%;
            height: 380px;
            object-fit: cover;
        }

        .btn-details {
            background-color: #f0830a;
            color: white;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-details:hover {
            background-color: #f25e07;
            color: white;
            transform: translateY(-2px);
        }

        .btn-details:active {
            transform: translateY(0px);
        }
    </style>
</head>

<body data-bs-theme="dark">
    <nav class="navbar navbar-expand-lg bg-body-tertiary mb-3">
        <div class="container">
            <a class="navbar-brand" href="./index.html">
                <i class="fa-solid fa-book"></i> BookVerse
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="fa-regular fa-house"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="list.html">
                            <i class="fa-solid fa-list"></i> List
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="bookstore.html">
                            <i class="fa-solid fa-store"></i> Bookstores
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <div id="books"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        fetch('https://openlibrary.org/search.json?q=bestseller')
            .then(rsp => rsp.json())
            .then(data => {
                const list = document.getElementById('books')

                const books = data.docs.slice(0, 60)

                books.forEach(book => {
                    const item = document.createElement('div')
                    item.classList.add('card', 'book-card')

                    const image = book.cover_i
                        ? `https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg`
                        : 'https://via.placeholder.com/286x420?text=No+Cover'

                    item.innerHTML = `
                    <img src="${image}" class="card-img-top">
                    <div class="card-body d-flex flex-column">
                    <h5>${book.title}</h5>
                    <p>${book.author_name?.[0] || 'Nepoznat autor'}</p>

                     <a href="details.html?id=${book.key}" class="btn btn-details mt-auto">
                        Details
                    </a>
                    </div>
`

                    list.appendChild(item)
                })
            })
    </script>
</body>

</html>
